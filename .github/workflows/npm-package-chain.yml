name: Publish npm package chain

on:
  workflow_dispatch:
    inputs:
      publish_mode:
        required: true
        type: choice
        options: [bootstrap, oidc]
      confirmation:
        description: Enter PUBLISH_NEXT_CHAIN
        required: true
        type: string
      trust_confirmation:
        description: Enter BOOTSTRAP_IRREVERSIBLE or OIDC_TRUST_CONFIGURED
        required: true
        type: string
      source_sha:
        description: Exact 40-character main commit SHA
        required: true
        type: string

concurrency:
  group: xyva-public-npm-package-chain-next
  cancel-in-progress: false

jobs:
  prepare_next:
    name: prepare-next
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs['artifact-id'] }}
      artifact_digest: ${{ steps.upload.outputs['artifact-digest'] }}
    steps:
      - name: Reject non-GitHub-hosted execution
        if: runner.environment != 'github-hosted'
        run: exit 1
      - name: Require exact public source and confirmation
        env:
          APPROVED_SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
          RELEASE_MODE: ${{ inputs.publish_mode }}
          TRUST_CONFIRMATION: ${{ inputs.trust_confirmation }}
        run: |
          test "$GITHUB_REPOSITORY" = "xyva-ai/xyva-platform-packages"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$APPROVED_SOURCE_SHA"
          printf '%s' "$APPROVED_SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$RELEASE_CONFIRMATION" = "PUBLISH_NEXT_CHAIN"
          case "$RELEASE_MODE" in bootstrap) test "$TRUST_CONFIRMATION" = "BOOTSTRAP_IRREVERSIBLE" ;; oidc) test "$TRUST_CONFIRMATION" = "OIDC_TRUST_CONFIGURED" ;; *) exit 1 ;; esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.5.1 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund && npm run verify:public
      - name: Verify immutable public package contracts
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs"
          const expected = [
            ["contracts", "@xyva/contracts", "0.1.0", {}],
            ["bridge-types", "@xyva/bridge-types", "0.1.1", { "@xyva/contracts": "0.1.0" }],
            ["bridge-browser", "@xyva/bridge-browser", "0.1.0", { "@xyva/bridge-types": "0.1.1" }],
            ["agent", "@xyva/agent", "0.1.13", { "@xyva/contracts": "0.1.0", "@xyva/bridge-types": "0.1.1" }],
          ]
          for (const [directory, name, version, dependencies] of expected) {
            const manifest = JSON.parse(fs.readFileSync(`packages/${directory}/package.json`, "utf8"))
            const internal = Object.fromEntries(Object.entries(manifest.dependencies ?? {}).filter(([key]) => key.startsWith("@xyva/")))
            if (manifest.name !== name || manifest.version !== version || manifest.repository?.url !== "git+https://github.com/xyva-ai/xyva-platform-packages.git" || JSON.stringify(internal) !== JSON.stringify(dependencies)) throw new Error(`Unexpected immutable contract: ${directory}`)
          }
          NODE
      - name: Pack exact immutable chain
        run: |
          mkdir .release
          for package in contracts bridge-types bridge-browser agent; do npm pack --workspace "@xyva/$package" --pack-destination .release --ignore-scripts; done
          test "$(node -p "require('./packages/contracts/package.json').version")" = "0.1.0"
          test "$(node -p "require('./packages/bridge-types/package.json').version")" = "0.1.1"
          test "$(node -p "require('./packages/bridge-browser/package.json').version")" = "0.1.0"
          test "$(node -p "require('./packages/agent/package.json').version")" = "0.1.13"
          sha256sum .release/*.tgz > .release/SHA256SUMS
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-package-chain-${{ inputs.source_sha }}
          path: .release
          if-no-files-found: error
          retention-days: 90

  publish_bootstrap:
    if: inputs.publish_mode == 'bootstrap'
    needs: prepare_next
    runs-on: ubuntu-24.04
    environment:
      name: npm-bootstrap
    permissions:
      contents: read
    steps:
      - name: Reject non-GitHub-hosted execution
        if: runner.environment != 'github-hosted'
        run: exit 1
      - name: Require npm-bootstrap sentinel
        env:
          XYVA_NPM_ENVIRONMENT_GUARD: ${{ vars.XYVA_NPM_ENVIRONMENT_GUARD }}
        run: test "$XYVA_NPM_ENVIRONMENT_GUARD" = "xyva-npm-bootstrap-v1"
      - name: Revalidate exact publication authority
        env:
          APPROVED_SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
          TRUST_CONFIRMATION: ${{ inputs.trust_confirmation }}
        run: test "$GITHUB_REPOSITORY" = "xyva-ai/xyva-platform-packages" && test "$GITHUB_REF" = "refs/heads/main" && test "$GITHUB_SHA" = "$APPROVED_SOURCE_SHA" && test "$RELEASE_CONFIRMATION" = "PUBLISH_NEXT_CHAIN" && test "$TRUST_CONFIRMATION" = "BOOTSTRAP_IRREVERSIBLE"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - run: node scripts/release/verify-npm-environment-policy.mjs
        env:
          GITHUB_ENVIRONMENT_NAME: npm-bootstrap
          GITHUB_TOKEN: ${{ github.token }}
          XYVA_NPM_ENVIRONMENT_GUARD: ${{ vars.XYVA_NPM_ENVIRONMENT_GUARD }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.5.1 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: npm-package-chain-${{ inputs.source_sha }}
          path: .release
      - run: sha256sum --check SHA256SUMS && npm publish xyva-contracts-0.1.0.tgz --tag next --ignore-scripts && npm publish xyva-bridge-types-0.1.1.tgz --tag next --ignore-scripts && npm publish xyva-bridge-browser-0.1.0.tgz --tag next --ignore-scripts && npm publish xyva-agent-0.1.13.tgz --tag next --ignore-scripts
        working-directory: .release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}

  publish_oidc:
    if: inputs.publish_mode == 'oidc'
    needs: prepare_next
    runs-on: ubuntu-24.04
    environment:
      name: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Reject non-GitHub-hosted execution
        if: runner.environment != 'github-hosted'
        run: exit 1
      - name: Require npm-publish sentinel
        env:
          XYVA_NPM_ENVIRONMENT_GUARD: ${{ vars.XYVA_NPM_ENVIRONMENT_GUARD }}
        run: test "$XYVA_NPM_ENVIRONMENT_GUARD" = "xyva-npm-publish-v1"
      - name: Revalidate exact publication authority
        env:
          APPROVED_SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
          TRUST_CONFIRMATION: ${{ inputs.trust_confirmation }}
        run: test "$GITHUB_REPOSITORY" = "xyva-ai/xyva-platform-packages" && test "$GITHUB_REF" = "refs/heads/main" && test "$GITHUB_SHA" = "$APPROVED_SOURCE_SHA" && test "$RELEASE_CONFIRMATION" = "PUBLISH_NEXT_CHAIN" && test "$TRUST_CONFIRMATION" = "OIDC_TRUST_CONFIGURED"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - run: node scripts/release/verify-npm-environment-policy.mjs
        env:
          GITHUB_ENVIRONMENT_NAME: npm-publish
          GITHUB_TOKEN: ${{ github.token }}
          XYVA_NPM_ENVIRONMENT_GUARD: ${{ vars.XYVA_NPM_ENVIRONMENT_GUARD }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.5.1 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: npm-package-chain-${{ inputs.source_sha }}
          path: .release
      - run: test -z "${NODE_AUTH_TOKEN:-}" && sha256sum --check SHA256SUMS && npm publish xyva-contracts-0.1.0.tgz --tag next --ignore-scripts && npm publish xyva-bridge-types-0.1.1.tgz --tag next --ignore-scripts && npm publish xyva-bridge-browser-0.1.0.tgz --tag next --ignore-scripts && npm publish xyva-agent-0.1.13.tgz --tag next --ignore-scripts
        working-directory: .release
