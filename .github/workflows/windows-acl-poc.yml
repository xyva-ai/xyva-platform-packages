name: Windows ACL security proof of concept
on:
  pull_request:
    branches: [main]
    types: [labeled]
permissions:
  contents: read
jobs:
  acl-poc:
    if: github.event.label.name == 'ci:windows-acl' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main'
    runs-on: windows-2025
    steps:
      - if: runner.environment != 'github-hosted'
        shell: pwsh
        run: exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne '${{ github.event.pull_request.head.sha }}') { throw 'Head SHA mismatch' }
          pwsh -NoProfile -NonInteractive -File spikes/windows-acl/WindowsAclProof.Tests.ps1
